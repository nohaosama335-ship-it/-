name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Create Android project files
        run: |
          cp pubspec.yaml "$RUNNER_TEMP/pubspec.yaml"
          cp lib/main.dart "$RUNNER_TEMP/main.dart"
          flutter create --platforms=android --project-name yawmii_ma_allah --org com.yawmi .
          cp "$RUNNER_TEMP/pubspec.yaml" pubspec.yaml
          cp "$RUNNER_TEMP/main.dart" lib/main.dart

      - name: Add INTERNET permission
        run: |
          sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET"/>\n    <application#' android/app/src/main/AndroidManifest.xml
          grep -n "INTERNET" android/app/src/main/AndroidManifest.xml

      - run: flutter pub get

      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: yawmi-apk
          path: build/app/outputs/flutter-apk/app-release.apk
